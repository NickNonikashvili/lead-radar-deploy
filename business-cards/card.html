<head>
<meta charset="utf-8">
<title>Megan Pimley business card</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Atkinson+Hyperlegible:wght@400;700&family=Martian+Mono:wdth,wght@75..112.5,300..700&display=block">
<style>
:root {
  --mat: #E2E8EB; --raised: #F5F8F9; --ink: #111E27; --ink-soft: #4A5D6A;
  --kapton: #9A5005; --tape-a: rgba(232, 146, 44, .8); --grid: rgba(42, 104, 147, .11);
  --light: #E3EAEE; --light-soft: #97AAB6; --amber: #F2A04A; --dark-grid: rgba(207, 222, 231, .07);
  --tick: rgba(17, 30, 39, .38); --tape-ink: #1E1306;
  --display: "Archivo", "Arial Narrow", Arial, sans-serif;
  --body: "Atkinson Hyperlegible", Arial, sans-serif;
  --mono: "Martian Mono", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: #FFFFFF; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.card { position: relative; width: 3.75in; height: 2.25in; overflow: hidden; break-after: page; }
.card:last-of-type { break-after: auto; }
.safe { position: absolute; inset: .25in; }
.tape { position: absolute; background: var(--tape-a); }
.screw { position: absolute; width: .12in; height: .12in; }
.screw .lobes { fill: var(--ink); }
.label {
  display: flex; align-items: center; gap: 4pt;
  font-family: var(--mono); font-stretch: 87.5%; font-weight: 500; font-size: 5.3pt; line-height: 1;
  letter-spacing: .12em; text-transform: uppercase; color: var(--kapton);
}
.label::before { content: ""; width: 9pt; height: 3.4pt; background: var(--tape-a); transform: rotate(-4deg); flex: none; }

/* front */
.front {
  background-color: var(--mat); color: var(--ink);
  background-image: linear-gradient(var(--grid) .5pt, transparent .5pt), linear-gradient(90deg, var(--grid) .5pt, transparent .5pt);
  background-size: .125in .125in; background-position: .125in .125in;
}
.front .screw .head { fill: var(--raised); stroke: var(--ink-soft); stroke-width: 1.6; }
.tape-f { top: .05in; right: -.2in; width: 1.05in; height: .25in; transform: rotate(32deg); }
.f-safe { display: flex; flex-direction: column; }
.name {
  margin-top: 7pt;
  font-family: var(--display); font-weight: 850; font-stretch: 125%;
  font-size: 29pt; line-height: .9; letter-spacing: -.02em; text-transform: uppercase;
}
.name span { display: block; }
.name .outline { color: transparent; -webkit-text-stroke: .7pt var(--ink); }
.role { margin-top: 6pt; font-family: var(--body); font-weight: 700; font-size: 6.6pt; line-height: 1.3; color: var(--ink-soft); }
.tagline {
  align-self: flex-start; margin-top: 9pt;
  padding: 3.2pt 7pt 3.4pt;
  background: var(--tape-a); color: var(--tape-ink);
  font-family: var(--display); font-weight: 750; font-stretch: 105%;
  font-size: 8pt; line-height: 1; letter-spacing: .005em;
  transform: rotate(-2deg); transform-origin: left center;
}
.contact { margin-top: auto; display: grid; gap: 3pt; }
.contact div { display: flex; align-items: baseline; gap: 5pt; }
.contact dt { width: .36in; font-family: var(--mono); font-stretch: 87.5%; font-size: 4.6pt; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-soft); }
.contact dd { font-family: var(--mono); font-stretch: 87.5%; font-weight: 500; font-size: 6.3pt; color: var(--ink); }
.f-screw { right: 0; bottom: 0; }
.ruler {
  position: absolute; left: 0; right: 0; bottom: .125in; height: .1in;
  background-image: linear-gradient(90deg, var(--tick) .5pt, transparent .5pt), linear-gradient(90deg, var(--tick) .5pt, transparent .5pt);
  background-size: .0625in 3pt, .25in 6.5pt;
  background-position: .125in 100%, .125in 100%;
  background-repeat: repeat-x;
}

/* back */
.back {
  background-color: var(--ink); color: var(--light);
  background-image: linear-gradient(var(--dark-grid) .5pt, transparent .5pt), linear-gradient(90deg, var(--dark-grid) .5pt, transparent .5pt);
  background-size: .125in .125in; background-position: .125in .125in;
}
.back .screw .head { fill: #1B2933; stroke: var(--light-soft); stroke-width: 1.6; }
.back .screw .lobes { fill: var(--light); }
.sc-tl { left: .225in; top: .225in; } .sc-tr { right: .225in; top: .225in; }
.sc-bl { left: .225in; bottom: .225in; } .sc-br { right: .225in; bottom: .225in; }
.tape-b { top: -.05in; right: .6in; width: .92in; height: .25in; transform: rotate(-8deg); }
.b-safe { display: grid; grid-template-columns: 1.28in minmax(0, 1fr); gap: .22in; align-items: center; }
.qr-wrap { position: relative; width: 1.28in; height: 1.28in; }
.qr-wrap svg { display: block; width: 100%; height: 100%; border-radius: .04in; }
.cm { position: absolute; width: .1in; height: .1in; border: 0 solid var(--amber); }
.cm.tl { left: -.06in; top: -.06in; border-left-width: .9pt; border-top-width: .9pt; }
.cm.tr { right: -.06in; top: -.06in; border-right-width: .9pt; border-top-width: .9pt; }
.cm.bl { left: -.06in; bottom: -.06in; border-left-width: .9pt; border-bottom-width: .9pt; }
.cm.br { right: -.06in; bottom: -.06in; border-right-width: .9pt; border-bottom-width: .9pt; }
.b-label { color: var(--amber); }
.scan {
  margin-top: 6pt;
  font-family: var(--display); font-weight: 800; font-stretch: 112%;
  font-size: 15pt; line-height: 1; letter-spacing: -.01em; color: var(--light);
}
.url { margin-top: 6pt; font-family: var(--mono); font-stretch: 87.5%; font-size: 5pt; line-height: 1.55; color: var(--light-soft); }
.sign { margin-top: 10pt; display: flex; align-items: center; gap: 5pt; font-family: var(--body); font-weight: 700; font-size: 6.4pt; color: var(--light); }
.mark {
  width: 14pt; height: 14pt; display: grid; place-items: center; flex: none;
  border: .7pt solid var(--light); border-radius: 3pt;
  font-family: var(--display); font-weight: 850; font-stretch: 125%; font-size: 5.4pt; letter-spacing: .02em;
}
@page { size: 3.75in 2.25in; margin: 0; }</style>
</head>
