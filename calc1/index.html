<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>M171 Study Hub</title>
  <meta name="description" content="Study companion for M171 Calculus I, Fall 2026: calendar, section notes, formula sheet, flashcards, an endless quizzer, exam prep, grapher, labs, grade calculator and scratchpad.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=STIX+Two+Text:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css">
  <script>
    window.MathJax = {
      tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']], processEscapes: true },
      svg: { fontCache: 'global' },
      startup: { typeset: false },
      options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code', 'input', 'select', 'option'] }
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-svg.js"></script>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="Navigation">
      <div class="brand"><span class="brand-code">M171</span><span class="brand-name">Calculus I<small>Fall 2026 · Study Hub</small></span></div>
      <nav id="sidebar-nav"></nav>
      <div class="sidebar-foot">
        <div class="pomo">
          <div><div class="pomo-time" id="pomo-time">25:00</div><div class="pomo-mode" id="pomo-mode">Focus</div></div>
          <div class="pomo-btns">
            <button class="icon-btn" id="pomo-toggle" data-action="pomo-toggle" title="Start / pause"></button>
            <button class="icon-btn" data-action="pomo-reset" title="Reset"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg></button>
            <button class="icon-btn" data-action="pomo-mode" title="Switch focus / break"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></button>
          </div>
        </div>
      </div>
    </aside>
    <div class="nav-backdrop" id="nav-backdrop"></div>
    <div class="main">
      <header class="topbar" id="topbar">
        <button class="icon-btn menu-btn" data-action="menu" aria-label="Menu"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
        <div class="topbar-title" id="topbar-title">Dashboard</div>
        <div class="topbar-actions">
          <button class="exam-chip" id="exam-chip" data-action="exam-chip" title="Next exam"></button>
          <button class="search-btn" data-action="search" aria-label="Search"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><span>Search</span><span class="kbd">Ctrl K</span></button>
          <button class="icon-btn" id="theme-btn" data-action="theme" aria-label="Toggle theme"></button>
        </div>
      </header>
      <main class="page" id="view"></main>
    </div>
  </div>
  <script src="assets/data.js"></script>
  <script src="assets/quiz.js"></script>
  <script src="assets/app.js"></script>
  <script src="assets/tools.js"></script>
</body>
</html>
