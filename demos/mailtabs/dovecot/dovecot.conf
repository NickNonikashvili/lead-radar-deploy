# Dovecot 2.3 config for the PUBLIC Mailtabs demo.
#
# - Only the fictional mailboxes listed in demo-users exist (passwd-file, one shared demo password).
# - Plain IMAP on port 3343, no TLS: it is only reachable on the demo's internal Docker network
#   (or 127.0.0.1 when run locally). Never publish this port to the internet.
# - Every mailbox has a small quota, so a visitor can't fill the disk.
#
# Tested locally with Ubuntu 24.04's dovecot-imapd 2.3.21 (the same package the Dockerfile installs).
# Paths below are the container paths; the local test run rewrites them with sed.

protocols = imap
listen = *

base_dir = /run/dovecot
state_dir = /var/lib/dovecot
log_path = /dev/stderr
info_log_path = /dev/stdout

# Unencrypted on purpose (internal network only); Mailtabs connects with security "none",
# which it only allows when ALLOW_PRIVATE_IMAP_HOSTS=true.
ssl = no
disable_plaintext_auth = no
auth_mechanisms = plain login
auth_username_chars = abcdefghijklmnopqrstuvwxyz0123456789.-_@
auth_failure_delay = 1 secs

default_internal_user = dovecot
default_login_user = dovenull

# Every demo mailbox is owned by one unprivileged numeric uid/gid (no /etc/passwd entry needed).
first_valid_uid = 5000
last_valid_uid = 5000
first_valid_gid = 5000
last_valid_gid = 5000

passdb {
  driver = passwd-file
  args = scheme=PLAIN username_format=%Lu /etc/dovecot/demo-users
}
userdb {
  driver = static
  args = uid=5000 gid=5000 home=/srv/mail/%Ld/%Ln
}

mail_location = maildir:~/Maildir
mail_plugins = $mail_plugins quota

namespace inbox {
  inbox = yes
  separator = /
  mailbox Drafts {
    special_use = \Drafts
    auto = subscribe
  }
  mailbox Sent {
    special_use = \Sent
    auto = subscribe
  }
  mailbox Archive {
    special_use = \Archive
    auto = subscribe
  }
  mailbox Junk {
    special_use = \Junk
    auto = subscribe
  }
  mailbox Trash {
    special_use = \Trash
    auto = subscribe
  }
}

plugin {
  quota = maildir:Demo quota
  quota_rule = *:storage=100M
  quota_rule2 = Trash:storage=+20M
}

protocol imap {
  mail_plugins = $mail_plugins imap_quota
  # Mailtabs opens a few short connections per account; visitors share one login.
  mail_max_userip_connections = 40
}

service imap-login {
  inet_listener imap {
    port = 3343
  }
  inet_listener imaps {
    port = 0
  }
}

# Nothing else is needed: no LMTP/LDA (the demo SMTP sink delivers with IMAP APPEND), no POP3.
